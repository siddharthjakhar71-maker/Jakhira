<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta property="og:title" content="Billionaire Homes LLP - Purchase Department" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Billionaire Homes LLP - Purchase Department</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('theme') || localStorage.getItem('app-theme') || 'system';
          var primaryColor = localStorage.getItem('primary-color') || localStorage.getItem('app-primary-color') || '#2563eb';
          var resolved = theme === 'system'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : theme;
          if (resolved === 'dark') document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = resolved;
          document.documentElement.style.setProperty('--primary-color', primaryColor);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
